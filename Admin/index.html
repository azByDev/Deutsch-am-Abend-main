<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Sign In — Deutsch am Abend</title>
    <meta
      name="description"
      content="Sign in to the Deutsch am Abend admin dashboard to manage events, courses, and consultations."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Crimson+Text:wght@400;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../assets/style.css" />
    <style>
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background:
          radial-gradient(ellipse at 30% 20%, rgba(45, 80, 22, 0.06) 0%, transparent 60%),
          radial-gradient(ellipse at 70% 80%, rgba(212, 165, 116, 0.08) 0%, transparent 50%),
          var(--cream);
      }
      .auth-card {
        width: 100%;
        max-width: 440px;
        margin: 32px 20px;
        padding: 44px 36px 40px;
        background: var(--paper);
        border: 1px solid var(--line);
        border-radius: 18px;
        box-shadow: var(--shadow);
        animation: auth-enter 0.45s ease-out;
      }
      @keyframes auth-enter {
        from { opacity: 0; transform: translateY(18px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      .auth-brand {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 32px;
        text-decoration: none;
        color: inherit;
      }
      .auth-brand .brand-mark {
        width: 48px;
        height: 48px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--forest);
        color: #fff;
        font: 700 1rem var(--mono);
        border-radius: 12px;
        letter-spacing: 0.04em;
        flex-shrink: 0;
      }
      .auth-brand-text {
        display: flex;
        flex-direction: column;
      }
      .auth-brand-text strong {
        font: 600 1.15rem var(--display);
        color: var(--forest);
      }
      .auth-brand-text small {
        font-size: 0.78rem;
        color: var(--slate);
        margin-top: 2px;
      }
      .auth-card h1 {
        font-size: 1.55rem;
        margin-bottom: 6px;
      }
      .auth-card .auth-subtitle {
        color: var(--slate);
        font-size: 0.92rem;
        margin-bottom: 28px;
      }
      .auth-field {
        margin-bottom: 18px;
      }
      .auth-field label {
        display: block;
        font-size: 0.84rem;
        font-weight: 600;
        color: var(--charcoal);
        margin-bottom: 6px;
      }
      .auth-field input {
        width: 100%;
        padding: 11px 14px;
        border: 1px solid var(--line);
        border-radius: 8px;
        font: inherit;
        font-size: 0.95rem;
        background: var(--cream);
        color: var(--charcoal);
        transition: border-color 0.2s, box-shadow 0.2s;
      }
      .auth-field input:focus {
        outline: none;
        border-color: var(--forest);
        box-shadow: 0 0 0 3px rgba(45, 80, 22, 0.12);
      }
      .auth-field input::placeholder {
        color: var(--slate);
        opacity: 0.6;
      }
      .auth-password-wrap {
        position: relative;
      }
      .auth-password-wrap input {
        padding-right: 46px;
      }
      .auth-toggle-pw {
        position: absolute;
        right: 4px;
        top: 50%;
        transform: translateY(-50%);
        background: none;
        border: none;
        cursor: pointer;
        padding: 8px;
        color: var(--slate);
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 6px;
        transition: color 0.2s;
      }
      .auth-toggle-pw:hover {
        color: var(--forest);
      }
      .auth-toggle-pw svg {
        width: 20px;
        height: 20px;
      }
      .auth-submit {
        width: 100%;
        margin-top: 6px;
        padding: 13px 16px;
        background: var(--forest);
        color: #fff;
        border: none;
        border-radius: 10px;
        font: 600 0.95rem var(--body);
        cursor: pointer;
        transition: background 0.2s, transform 0.1s;
      }
      .auth-submit:hover {
        background: #3a6a1e;
      }
      .auth-submit:active {
        transform: scale(0.985);
      }
      .auth-submit:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }
      .auth-status {
        margin-top: 16px;
        font-size: 0.88rem;
        min-height: 1.4em;
        transition: color 0.2s;
      }
      .auth-status.error {
        color: #a33;
      }
      .auth-status.info {
        color: var(--slate);
      }
      .auth-status.success {
        color: var(--forest);
      }
      .auth-footer {
        margin-top: 24px;
        padding-top: 20px;
        border-top: 1px solid var(--line);
        text-align: center;
        font-size: 0.88rem;
        color: var(--slate);
      }
      .auth-footer a {
        color: var(--forest);
        font-weight: 600;
        text-decoration: none;
        transition: color 0.2s;
      }
      .auth-footer a:hover {
        color: var(--orange);
      }
      .auth-back {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        margin-top: 20px;
        font-size: 0.84rem;
        color: var(--slate);
        text-decoration: none;
        transition: color 0.2s;
      }
      .auth-back:hover {
        color: var(--forest);
      }
      .auth-back svg {
        width: 16px;
        height: 16px;
      }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../assets/supabase-config.js"></script>
    <script src="../assets/meeting-sync.js"></script>
  </head>
  <body>
    <div class="auth-card">
      <a href="../index.html" class="auth-brand">
        <span class="brand-mark">DAA</span>
        <span class="auth-brand-text">
          <strong>Deutsch am Abend</strong>
          <small>Admin Portal</small>
        </span>
      </a>

      <h1>Sign in</h1>
      <p class="auth-subtitle">
        Enter your credentials to access the admin dashboard.
      </p>

      <form id="signin-form" novalidate>
        <div class="auth-field">
          <label for="signin-email">Email address</label>
          <input
            id="signin-email"
            type="email"
            autocomplete="username"
            placeholder="you@example.com"
            required
          />
        </div>
        <div class="auth-field">
          <label for="signin-password">Password</label>
          <div class="auth-password-wrap">
            <input
              id="signin-password"
              type="password"
              autocomplete="current-password"
              placeholder="Enter your password"
              required
            />
            <button type="button" class="auth-toggle-pw" aria-label="Show password" data-toggle-password="signin-password">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"/>
                <circle cx="12" cy="12" r="2.5"/>
              </svg>
            </button>
          </div>
        </div>
        <button type="submit" class="auth-submit" id="signin-submit">Sign in</button>
      </form>

      <p class="auth-status" id="signin-status" role="status"></p>

      <div class="auth-footer">
        Don't have an account? <a href="signup.html">Create one</a>
      </div>

      <a href="../index.html" class="auth-back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M19 12H5M12 5l-7 7 7 7"/>
        </svg>
        Back to website
      </a>
    </div>

    <script>
      (function () {
        "use strict";

        var form = document.getElementById("signin-form");
        var emailInput = document.getElementById("signin-email");
        var passwordInput = document.getElementById("signin-password");
        var submitButton = document.getElementById("signin-submit");
        var statusEl = document.getElementById("signin-status");

        /* ---- Password toggle ---- */
        document.querySelectorAll("[data-toggle-password]").forEach(function (btn) {
          btn.addEventListener("click", function () {
            var input = document.getElementById(btn.dataset.togglePassword);
            var isHidden = input.type === "password";
            input.type = isHidden ? "text" : "password";
            btn.setAttribute("aria-label", isHidden ? "Hide password" : "Show password");
          });
        });

        /* ---- Supabase client ---- */
        var sync = window.DAAMeetingSync;
        if (!sync || !sync.isConfigured()) {
          setStatus("Supabase is not configured. Update assets/supabase-config.js.", "error");
          submitButton.disabled = true;
          return;
        }

        var client;
        try {
          client = sync.getClient();
        } catch (err) {
          setStatus(err.message, "error");
          submitButton.disabled = true;
          return;
        }

        /* ---- If already signed in, try to go to dashboard ---- */
        client.auth.getSession().then(function (result) {
          if (result.data && result.data.session) {
            verifyAndRedirect(result.data.session.user);
          }
        });

        /* ---- Form submit ---- */
        form.addEventListener("submit", async function (e) {
          e.preventDefault();
          var email = emailInput.value.trim();
          var password = passwordInput.value;
          if (!email || !password) {
            setStatus("Please fill in both fields.", "error");
            return;
          }
          submitButton.disabled = true;
          setStatus("Signing in…", "info");
          try {
            var result = await client.auth.signInWithPassword({
              email: email,
              password: password,
            });
            if (result.error) throw result.error;
            await verifyAndRedirect(result.data.user);
          } catch (err) {
            var msg = err.message || "Sign-in failed. Please try again.";
            var lower = msg.toLowerCase();
            if (lower.includes("email not confirmed")) {
              var btnHtml =
                '<div style="margin-top:8px"><button type="button" id="resend-conf-btn" style="background:none;border:none;color:var(--forest);font-weight:600;text-decoration:underline;cursor:pointer;padding:0;font-size:inherit">Resend confirmation email</button><span id="resend-conf-msg" style="margin-left:8px;font-size:0.82rem"></span></div>' +
                '<p style="margin-top:6px;font-size:0.8rem;color:var(--slate)">Tip: Check spam folder, or confirm this user directly in Supabase Dashboard &gt; Authentication &gt; Users.</p>';
              setStatus(
                "<strong>Email not confirmed yet.</strong> " + btnHtml,
                "error",
                true
              );
              var resendBtn = document.getElementById("resend-conf-btn");
              var resendMsg = document.getElementById("resend-conf-msg");
              if (resendBtn) {
                resendBtn.addEventListener("click", async function () {
                  resendBtn.disabled = true;
                  resendMsg.textContent = "Sending…";
                  try {
                    var r = await client.auth.resend({ type: "signup", email: email });
                    if (r.error) throw r.error;
                    resendMsg.textContent = "Sent! Check inbox and spam.";
                    resendMsg.style.color = "var(--forest)";
                  } catch (resendErr) {
                    resendMsg.textContent = "Error: " + (resendErr.message || "Try again");
                    resendMsg.style.color = "#a33";
                    resendBtn.disabled = false;
                  }
                });
              }
              return;
            }
            if (lower.includes("schema cache") || msg.includes("daa_admin_users")) {
              setStatus(
                "<strong>Database table missing:</strong> The table <code>public.daa_admin_users</code> was not found in Supabase. Please open the Supabase SQL Editor and run <code>supabase-meeting-sync.sql</code>.",
                "error",
                true
              );
              return;
            }
            setStatus(msg, "error");
          } finally {
            submitButton.disabled = false;
          }
        });

        async function verifyAndRedirect(user) {
          try {
            var result = await client
              .from("daa_admin_users")
              .select("user_id")
              .eq("user_id", user.id)
              .maybeSingle();
            if (result.error) {
              var errMsg = result.error.message || "";
              if (errMsg.includes("daa_admin_users") || errMsg.toLowerCase().includes("schema cache")) {
                setStatus(
                  "<strong>Database table missing:</strong> The table <code>public.daa_admin_users</code> was not found in Supabase. Please open the Supabase SQL Editor and run <code>supabase-meeting-sync.sql</code>.",
                  "error",
                  true
                );
                return;
              }
              throw result.error;
            }
            if (!result.data) {
              await client.auth.signOut();
              setStatus(
                "<strong>Admin access required:</strong> Your login is valid, but user ID <code>" +
                  escapeHtml(user.id) +
                  "</code> is not authorized in <code>daa_admin_users</code> yet. Add this UUID to <code>public.daa_admin_users</code> in Supabase to grant access.",
                "error",
                true
              );
              return;
            }
            setStatus("Redirecting to dashboard…", "success");
            window.location.replace("dashboard.html");
          } catch (err) {
            setStatus(err.message || "Could not verify admin access.", "error");
          }
        }

        function escapeHtml(text) {
          var div = document.createElement("div");
          div.textContent = text || "";
          return div.innerHTML;
        }

        function setStatus(message, type, isHtml) {
          if (isHtml) {
            statusEl.innerHTML = message;
          } else {
            statusEl.textContent = message;
          }
          statusEl.className = "auth-status " + (type || "");
        }
      })();
    </script>
  </body>
</html>
